services:

#Wanderlust Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wanderlust-backend

    restart: unless-stopped

    ports:
      - "5000:5000"
    
    networks:
      - wanderlust-network
    
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/wanderlust}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: ${PORT:-5000}
    
    depends_on:
      - mongo
      - redis    

#Wanderlust Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wanderlust-frontend
    
    restart: unless-stopped
    
    ports:
      - "3000:80"
    
    networks:
      - wanderlust-network
  mongo:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    networks:   
      - wanderlust-network
    volumes:
      - mongo-data:/data/db
    

  redis:
    image: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - wanderlust-network
    volumes:
     - redis-data:/data


volumes:
  mongo-data:
  redis-data:

networks:
  wanderlust-network:
      
