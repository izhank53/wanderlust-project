name: Wanderlust CI

on:
  push:
    branches: 
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #Build Backend Docker Image
      - name: Build backedn Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:${{ github.sha }} ./backend/

      # Run Trivy Scan
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
      
      #Run Hadolint Scan
      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./backend/Dockerfile

      # Push Backend Docker Image to Docker HUB
      - name: Push Backend Docker Image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:${{ github.sha }}


  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

# Build Frontend Docker Image
      - name: build frontend docker image 
        run: docker build -t ${{secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:${{ github.sha }} ./frontend/

# Run Trivy Scan
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./frontend/Dockerfile
  
# Push Frontend Docker Image to Docker HUB
      - name: Push Frontend Image to Docker Hub
        run: docker push -t ${{secrets.DOCKERHUB_USERNAME}}/wanderlust-frontend:${{ github.sha }}
