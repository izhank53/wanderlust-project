name: Wanderlust CI

on:
  push:
    branches: 
      - main
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #Run Hadolint Scan
      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./backend/Dockerfile

      #Build Backend Docker Image
      - name: Build backend Docker image
        run: |
         docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:${{ github.sha }} \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:latest \
          ./backend/

      # Run Trivy Scan
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
      

      # Push Backend Docker Image to Docker HUB
      - name: Push Backend Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:latest
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./frontend/Dockerfile

# Build Frontend Docker Image
      - name: Build Frontend Docker Image
        run: |
         docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:${{ github.sha }} \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:latest \
          ./frontend/

# Run Trivy Scan
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

  
# Push Frontend Docker Image to Docker HUB
      - name: Push Frontend Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:latest
