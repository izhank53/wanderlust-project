name: Wanderlust CI

on:
  push:
    branches: 
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backedn Docker image
        run: docker build -t wanderlust-backend ./backend/

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: wanderlust-backend
          format: table
          severity: HIGH,CRITICAL


  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: build frontend docker image 
        run: docker build -t wanderlust-frontend ./frontend/

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: wanderlust-frontend
          format: table
          severity: HIGH,CRITICAL


  
