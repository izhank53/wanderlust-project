apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: wanderlust-ingress
  namespace: wanderlust

spec:
  ingressClassName: nginx

  rules:
    - host: wanderlust.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: frontend-service
                port:
                  number: 80

          - path: /api
            pathtype: prefix
            
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
            

