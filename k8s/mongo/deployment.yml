apiVersion: apps/v1

kind: Deployment

metadata:
  name: mongo-deployment
  namespace: wanderlust

  labels:
    app: mongo

#spec defined the desired state of the deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo

#blueprint for creating pods
  template: 

    metadata:
      labels:
        app: mongo

#spec of a POD created by deployment
    spec: 
         
      containers:
        - name: mongo
      
    
      
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
  #mounths this storage inside container at /data/db
          volumeMounts:
            - name: mongo-persistent-storage
              mountPath: /data/db
  
  #claim on storage /data/db
      volumes:
        - name: mongo-persistent-storage
          persistentVolumeClaim:
            claimName: mongo-pvc

