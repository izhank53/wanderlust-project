apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: wanderlust
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/izhank53/wanderlust-project.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: wanderlust

  syncPolicy:
    automated:
      prune: true
      selfHeal: true